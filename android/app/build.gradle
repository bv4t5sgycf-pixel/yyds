plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
}

android {
    namespace 'com.example.waterdetect'
    compileSdk 34

    defaultConfig {
        applicationId "com.example.waterdetect"
        minSdk 21
        targetSdk 34
        versionCode 1
        versionName "1.0"
        vectorDrawables.useSupportLibrary true
        // 真机只需 arm64-v8a（现代）与 armeabi-v7a（旧 32 位），剔除 x86/x86_64 模拟器 ABI，显著缩小 APK
        ndk {
            abiFilters 'arm64-v8a', 'armeabi-v7a'
        }
    }

    buildTypes {
        debug {
            minifyEnabled false
        }
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    kotlinOptions {
        jvmTarget = '17'
    }
    buildFeatures {
        viewBinding true
    }

    // bytedeco 各平台原生 jar 内含 META-INF/native-image/** 的 GraalVM 配置，
    // 多平台 jar 路径重复导致 mergeDebugJavaResource 冲突；Android 运行时不需要，直接排除。
    packaging {
        resources {
            excludes += ["META-INF/native-image/**"]
        }
        // bytedeco 的 .so 从 jar 提取，ndk.abiFilters 不生效；显式剔除 x86/x86_64 模拟器 ABI，
        // 仅保留真机需要的 arm64-v8a + armeabi-v7a，显著缩小 APK。
        jniLibs {
            excludes += ["x86/**", "x86_64/**"]
        }
    }
}

dependencies {
    implementation 'androidx.core:core-ktx:1.13.1'
    implementation 'androidx.activity:activity:1.9.0'
    implementation 'androidx.appcompat:appcompat:1.7.0'
    implementation 'com.google.android.material:material:1.12.0'
    implementation 'androidx.constraintlayout:constraintlayout:2.1.4'
    // OpenCV for Android —— 使用 bytedeco 完整构建（Maven Central 上的
    // org.opencv:opencv 是残缺包，缺 MatVector/Calib3d/部分 Imgproc 常量）。
    // opencv-platform 含全部模块与 Android 各 ABI 原生 so，Loader 运行时自动提取。
    implementation 'org.bytedeco:opencv:4.10.0-1.5.11'
    implementation 'org.bytedeco:opencv-platform:4.10.0-1.5.11'
}
